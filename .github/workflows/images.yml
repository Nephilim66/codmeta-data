name: images
on:
  workflow_dispatch:
  push:
    paths: [images.txt, tools/fetch_images.py]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install "rembg[cpu]" pillow requests
      - run: python tools/fetch_images.py
      - run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add img || true
          git diff --cached --quiet || (git commit -m "Images armes" && git push)
